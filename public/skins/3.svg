<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a5d8ff"/>
      <stop offset="0.45" stop-color="#cfe5ff"/>
      <stop offset="0.75" stop-color="#ffe3f0"/>
      <stop offset="1" stop-color="#fff3f7"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff8d6"/>
      <stop offset="0.55" stop-color="#ffe9a8"/>
      <stop offset="1" stop-color="#ffe9a8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hill1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b7c9f2"/>
      <stop offset="1" stop-color="#d9c7f0"/>
    </linearGradient>
    <linearGradient id="hill2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#94a9e8"/>
      <stop offset="1" stop-color="#c3b3ea"/>
    </linearGradient>
    <linearGradient id="hill3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a90dd"/>
      <stop offset="1" stop-color="#a494e0"/>
    </linearGradient>
  </defs>

  <!-- 天空 -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- 太阳 -->
  <circle cx="1180" cy="190" r="210" fill="url(#sun)"/>
  <circle cx="1180" cy="190" r="64" fill="#fff6cf"/>
  <circle cx="1180" cy="190" r="64" fill="none" stroke="#ffffff" stroke-opacity="0.7" stroke-width="3"/>

  <!-- 云 -->
  <g fill="#ffffff" opacity="0.92">
    <ellipse cx="330" cy="170" rx="150" ry="42"/>
    <ellipse cx="420" cy="145" rx="110" ry="46"/>
    <ellipse cx="240" cy="150" rx="90" ry="36"/>
  </g>
  <g fill="#ffffff" opacity="0.75">
    <ellipse cx="790" cy="110" rx="120" ry="30"/>
    <ellipse cx="860" cy="92" rx="80" ry="34"/>
  </g>
  <g fill="#ffffff" opacity="0.6">
    <ellipse cx="1330" cy="320" rx="130" ry="26"/>
    <ellipse cx="1400" cy="300" rx="80" ry="30"/>
  </g>

  <!-- 远山 -->
  <path d="M0 560 Q 260 430 520 540 T 1080 520 T 1600 560 V900 H0 Z" fill="url(#hill1)" opacity="0.85"/>
  <path d="M0 640 Q 320 520 640 610 T 1600 620 V900 H0 Z" fill="url(#hill2)" opacity="0.9"/>
  <!-- 近山 -->
  <path d="M0 730 Q 400 620 820 700 T 1600 710 V900 H0 Z" fill="url(#hill3)"/>

  <!-- 樱花树剪影（右下） -->
  <g transform="translate(1290,690)">
    <path d="M0 210 C 8 140 -6 110 -18 70 C -28 38 -20 10 0 -6 C 22 12 28 40 16 72 C 4 108 16 142 26 210 Z" fill="#6d5a8f"/>
    <g fill="#f9a8d4">
      <circle cx="-70" cy="-30" r="52"/>
      <circle cx="0" cy="-70" r="62"/>
      <circle cx="72" cy="-26" r="50"/>
      <circle cx="-16" cy="-10" r="46"/>
      <circle cx="34" cy="-48" r="44"/>
    </g>
    <g fill="#fbcfe8" opacity="0.85">
      <circle cx="-56" cy="-44" r="26"/>
      <circle cx="14" cy="-84" r="30"/>
      <circle cx="60" cy="-40" r="24"/>
    </g>
  </g>

  <!-- 飘落花瓣 -->
  <g fill="#f9a8d4">
    <ellipse cx="180" cy="300" rx="10" ry="6" transform="rotate(24 180 300)"/>
    <ellipse cx="520" cy="240" rx="9" ry="5.5" transform="rotate(-18 520 240)"/>
    <ellipse cx="700" cy="420" rx="10" ry="6" transform="rotate(40 700 420)"/>
    <ellipse cx="940" cy="330" rx="8" ry="5" transform="rotate(-30 940 330)"/>
    <ellipse cx="1130" cy="470" rx="9" ry="5.5" transform="rotate(12 1130 470)"/>
    <ellipse cx="380" cy="520" rx="9" ry="5.5" transform="rotate(-24 380 520)"/>
    <ellipse cx="820" cy="600" rx="10" ry="6" transform="rotate(28 820 600)"/>
    <ellipse cx="1010" cy="150" rx="8" ry="5" transform="rotate(18 1010 150)"/>
  </g>

  <!-- 闪光 -->
  <g fill="#ffffff">
    <path d="M220 120 l4 12 12 4 -12 4 -4 12 -4 -12 -12 -4 12 -4 Z" opacity="0.9"/>
    <path d="M640 180 l3 9 9 3 -9 3 -3 9 -3 -9 -9 -3 9 -3 Z" opacity="0.7"/>
    <path d="M1450 120 l3 9 9 3 -9 3 -3 9 -3 -9 -9 -3 9 -3 Z" opacity="0.8"/>
    <path d="M1040 260 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3 Z" opacity="0.7"/>
    <path d="M120 420 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3 Z" opacity="0.75"/>
  </g>
</svg>
